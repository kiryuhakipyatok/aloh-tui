name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "1.0.0"

jobs:

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libtool \
            autoconf \
            automake \
            libx11-dev \
            libxcb1-dev \
            libasound2-dev \
            libpulse-dev \
            libwebp-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            libspeexdsp-dev
      - name: Build RNNoise
        run: |
          set -e
          mkdir -p "$HOME/local_libs"
          git clone --depth 1 \
            https://github.com/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure \
            --prefix="$HOME/local_libs" \
            --enable-shared \
            --disable-static
          make -j"$(nproc)"
          make install
      - name: Build OpenCV
        run: |
          set -e
          git clone \
            --depth 1 \
            --branch 4.10.0 \
            https://github.com/opencv/opencv.git
          cmake \
            -S opencv \
            -B opencv/build \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_INSTALL_PREFIX="$HOME/opencv_install" \
            -D BUILD_SHARED_LIBS=ON \
            -D OPENCV_GENERATE_PKGCONFIG=ON \
            -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
            -D BUILD_EXAMPLES=OFF \
            -D BUILD_TESTS=OFF \
            -D BUILD_PERF_TESTS=OFF
          cmake --build opencv/build --parallel
          cmake --install opencv/build
      - name: Build Go application
        run: |
          set -e
          export PREFIX="$HOME/local_libs"
          export OCV="$HOME/opencv_install"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$OCV/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CGO_CPPFLAGS="
            -I$PREFIX/include
            -I$OCV/include/opencv4
          "
          export CGO_LDFLAGS="
            -L$PREFIX/lib
            -L$OCV/lib
            -lopencv_core
            -lopencv_videoio
            -lopencv_imgproc
            -lopencv_imgcodecs
            -lopencv_highgui
            -lopusfile
            -lopus
            -logg
            -lspeexdsp
            -lrnnoise
            -Wl,-rpath,'\$ORIGIN'
          "
          go build \
            -v \
            -o aloh-linux \
            ./cmd/app
      - name: Package Linux
        run: |
          set -e
          mkdir -p dist-linux
          cp aloh-linux dist-linux/
          find "$HOME/local_libs/lib" \
            -maxdepth 1 \
            -name "*.so*" \
            -exec cp -d {} dist-linux/ \;
          find "$HOME/opencv_install/lib" \
            -maxdepth 1 \
            -name "*.so*" \
            -exec cp -d {} dist-linux/ \;
          tar cfvz aloh-linux.tar.gz \
            -C dist-linux .
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26"
        cache: true

    - name: Install MSYS2 dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        path-type: inherit
        install: >-
          git
          make
          autoconf
          automake
          libtool
          pkgconf
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-opencv
          mingw-w64-x86_64-opus
          mingw-w64-x86_64-opusfile
          mingw-w64-x86_64-libogg
          mingw-w64-x86_64-speexdsp

    - name: Verify OpenCV installation
      shell: msys2 {0}
      run: |
        set -e

        echo "=== OpenCV headers ==="

        if [ ! -f /mingw64/include/opencv4/opencv2/opencv.hpp ]; then
          echo "ERROR: OpenCV header not found!"
          find /mingw64/include -maxdepth 4 -type f -name opencv.hpp -print || true
          exit 1
        fi

        echo "Found:"
        ls -lh /mingw64/include/opencv4/opencv2/opencv.hpp

        echo ""
        echo "=== OpenCV libraries ==="
        ls -lh /mingw64/lib/libopencv*.dll.a || true

        echo ""
        echo "=== OpenCV DLLs ==="
        ls -lh /mingw64/bin/libopencv*.dll || true

        echo ""
        echo "=== pkg-config ==="
        pkg-config --modversion opencv4 || true
        pkg-config --cflags opencv4 || true
        pkg-config --libs opencv4 || true

    - name: Build RNNoise
      shell: msys2 {0}
      run: |
        set -e

        git clone --depth 1 https://github.com/xiph/rnnoise.git

        cd rnnoise

        ./autogen.sh

        ./configure \
          --prefix=/mingw64 \
          --enable-shared \
          --disable-static

        make -j"$(nproc)"
        make install

        cd ..

    - name: Verify CGO environment
      shell: msys2 {0}
      run: |
        set -e

        echo "=== GCC ==="
        gcc --version

        echo ""
        echo "=== G++ ==="
        g++ --version

        echo ""
        echo "=== Go ==="
        go version

        echo ""
        echo "=== OpenCV header ==="
        test -f /mingw64/include/opencv4/opencv2/opencv.hpp

        echo ""
        echo "=== pkg-config OpenCV ==="
        pkg-config --cflags opencv4
        pkg-config --libs opencv4

        echo ""
        echo "=== pkg-config audio ==="
        pkg-config --cflags --libs opus opusfile ogg speexdsp

    - name: Build Go application
      shell: msys2 {0}
      env:
        CGO_ENABLED: "1"
      run: |
        set -e

        export PATH="/mingw64/bin:$PATH"

        export CGO_CFLAGS="-I/mingw64/include/opencv4"
        export CGO_CXXFLAGS="-I/mingw64/include/opencv4"

        export CGO_LDFLAGS="
          -L/mingw64/lib
          -lopencv_core
          -lopencv_imgproc
          -lopencv_imgcodecs
          -lopencv_videoio
          -lopencv_highgui
          -lopencv_video
          -lopencv_calib3d
          -lopencv_features2d
          -lopencv_objdetect
          -lopencv_dnn
          -lopencv_photo
          -lopusfile
          -lopus
          -logg
          -lspeexdsp
          -lrnnoise
        "

        echo "=== CGO_CFLAGS ==="
        echo "$CGO_CFLAGS"

        echo ""
        echo "=== CGO_CXXFLAGS ==="
        echo "$CGO_CXXFLAGS"

        echo ""
        echo "=== CGO_LDFLAGS ==="
        echo "$CGO_LDFLAGS"

        echo ""
        echo "=== Testing OpenCV header ==="

        cat > /tmp/test_opencv.cpp <<'EOF'
        #include <opencv2/opencv.hpp>

        int main() {
            cv::Mat image;
            return 0;
        }
        EOF

        g++ \
          -I/mingw64/include/opencv4 \
          /tmp/test_opencv.cpp \
          -L/mingw64/lib \
          -lopencv_core \
          -o /tmp/test_opencv.exe

        echo "OpenCV C++ test: OK"

        echo ""
        echo "=== Go build ==="

        go build \
          -v \
          -o aloh.exe \
          ./cmd/app

    - name: Verify executable
      shell: msys2 {0}
      run: |
        set -e

        test -f aloh.exe

        echo "Executable:"
        ls -lh aloh.exe

        file aloh.exe

    - name: Package Windows
      shell: msys2 {0}
      run: |
        set -e

        rm -rf dist-win
        mkdir -p dist-win

        cp aloh.exe dist-win/

        echo "Copying OpenCV DLLs..."
        cp /mingw64/bin/libopencv*.dll dist-win/

        echo "Copying audio DLLs..."
        cp /mingw64/bin/libopus*.dll dist-win/
        cp /mingw64/bin/libogg*.dll dist-win/
        cp /mingw64/bin/libspeex*.dll dist-win/
        cp /mingw64/bin/librnnoise*.dll dist-win/

        echo "Copying MinGW runtime..."
        cp /mingw64/bin/libwinpthread-1.dll dist-win/
        cp /mingw64/bin/libstdc++-6.dll dist-win/
        cp /mingw64/bin/libgcc_s_seh-1.dll dist-win/

        echo "Copying OpenCV dependencies..."
        cp /mingw64/bin/libpng*.dll dist-win/ 2>/dev/null || true
        cp /mingw64/bin/libjpeg*.dll dist-win/ 2>/dev/null || true
        cp /mingw64/bin/libwebp*.dll dist-win/ 2>/dev/null || true
        cp /mingw64/bin/zlib1.dll dist-win/ 2>/dev/null || true
        cp /mingw64/bin/libtiff*.dll dist-win/ 2>/dev/null || true
        cp /mingw64/bin/libopenjp2*.dll dist-win/ 2>/dev/null || true

        echo ""
        echo "=== Final package ==="

        ls -lh dist-win/

        tar cfvz aloh-windows.tar.gz \
          -C dist-win .

    - name: Upload Windows
      uses: actions/upload-artifact@v4
      with:
        name: aloh-windows
        path: aloh-windows.tar.gz
