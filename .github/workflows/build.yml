name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libtool autoconf \
            libx11-dev libxcb1-dev libasound2-dev libpulse-dev libwebp-dev \
            libogg-dev libopus-dev libopusfile-dev libspeexdsp-dev
      - name: Build RNNoise (Linux)
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && ./autogen.sh
          ./configure --prefix=$HOME/local_libs --enable-shared --disable-static
          make -j$(nproc) && make install
      - name: Build OpenCV (Linux)
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir -p opencv/build && cd opencv/build
          # Добавлен OPENCV_GENERATE_PKGCONFIG и расширен список модулей для gocv
          cmake -D CMAKE_BUILD_TYPE=RELEASE \
                -D CMAKE_INSTALL_PREFIX=$HOME/opencv_install \
                -D OPENCV_GENERATE_PKGCONFIG=ON \
                -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
                -D WITH_V4L=ON -D WITH_WEBP=ON -D BUILD_EXAMPLES=OFF -D BUILD_TESTS=OFF ..
          make -j$(nproc) && make install
      - name: Run Go Build (Linux)
        run: |
          export PREFIX=$HOME/local_libs
          export OCV=$HOME/opencv_install
          # Правильный поиск pkgconfig (проверяем и lib, и lib64)
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$(find $OCV -name pkgconfig -type d | tr '\n' ':')$PKG_CONFIG_PATH"
          
          export CGO_CPPFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV/lib -L$OCV/lib64 -lopencv_core -lopencv_videoio -lopencv_imgproc -lopencv_imgcodecs -lopencv_highgui -lopusfile -lopus -logg -lspeexdsp -lrnnoise -lm"
          
          go build -v -o aloh-linux ./cmd/app
      - name: Collect Artifacts (Linux)
        run: |
          mkdir -p out/libs
          cp aloh-linux out/
          find $HOME/local_libs/lib -name "*.so*" -exec cp -P {} out/libs/ \;
          find $HOME/opencv_install -name "*.so*" -exec cp -P {} out/libs/ \;
          tar cfvz aloh-linux.tar.gz -C out .
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install MSYS2 & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            autoconf
            automake
            libtool
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo

      - name: Build RNNoise (Windows MinGW)
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=/opt/local --enable-shared=no --enable-static=yes
          make -j$(nproc) install

      - name: Build Ogg/Opus (Windows MinGW)
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/xiph/ogg.git
          cmake -S ogg -B ogg/build -G Ninja -DCMAKE_INSTALL_PREFIX=/opt/local -DBUILD_SHARED_LIBS=OFF
          cmake --build ogg/build --target install

          git clone --depth 1 https://github.com/xiph/opus.git
          cmake -S opus -B opus/build -G Ninja -DCMAKE_INSTALL_PREFIX=/opt/local -DBUILD_SHARED_LIBS=OFF
          cmake --build opus/build --target install

      - name: Build OpenCV (Windows Static MinGW)
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          cmake -S opencv -B opencv/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/opencv \
            -DBUILD_opencv_world=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_WEBP=ON \
            -DBUILD_WEBP=OFF \
            -DBUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DOPENCV_GENERATE_PKGCONFIG=ON
          cmake --build opencv/build --target install

      - name: Run Go Build (Windows)
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
        run: |
          export PATH="/opt/local/bin:/opt/opencv/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/local/lib/pkgconfig:/opt/opencv/lib/pkgconfig"

          export CGO_CFLAGS="-I/opt/local/include -I/opt/opencv/include/opencv4"
          export CGO_CXXFLAGS="-I/opt/local/include -I/opt/opencv/include/opencv4"

          export CGO_LDFLAGS="-L/opt/local/lib -L/opt/opencv/x64/mingw/staticlib \
            -lopencv_world4100 -lrnnoise -lopus -logg \
            -lwebp -lpng -ljpeg -ltiff -lz -lshlwapi -lws2_32 -lole32 -lgdi32 -lcomdlg32 -lavicap32 -lavifil32 -lmsvfw32"

          go build -v -tags netgo -ldflags="-s -w -extldflags '-static'" -o aloh.exe ./cmd/app

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe