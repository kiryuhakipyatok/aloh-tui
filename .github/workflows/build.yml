name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libtool autoconf automake m4 \
            libx11-dev libxcb1-dev libasound2-dev libpulse-dev libwebp-dev

      - name: Build Dependencies (Linux)
        run: |
          mkdir -p $HOME/local_libs
          PREFIX=$HOME/local_libs
          
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"

          git clone --depth 1 https://github.com/xiph/ogg.git
          cd ogg && ./autogen.sh && ./configure --prefix=$PREFIX --enable-shared && make -j$(nproc) install && cd ..

          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus && ./autogen.sh && ./configure --prefix=$PREFIX --enable-shared && make -j$(nproc) install && cd ..

          git clone --depth 1 https://github.com/xiph/opusfile.git
          cd opusfile && ./autogen.sh && ./configure --prefix=$PREFIX --enable-shared --disable-http && make -j$(nproc) install && cd ..
 
          git clone --depth 1 https://github.com/xiph/speexdsp.git
          cd speexdsp && ./autogen.sh && ./configure --prefix=$PREFIX --enable-shared && make -j$(nproc) install && cd ..

          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && ./autogen.sh && ./configure --prefix=$PREFIX --enable-shared && make -j$(nproc) install && cd ..

      - name: Build OpenCV (Linux)
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir -p opencv/build && cd opencv/build
          cmake -G "Ninja" \
                -D CMAKE_BUILD_TYPE=RELEASE \
                -D CMAKE_INSTALL_PREFIX=$HOME/opencv_install \
                -D OPENCV_GENERATE_PKGCONFIG=ON \
                -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
                -D WITH_V4L=ON -D WITH_WEBP=ON -D BUILD_EXAMPLES=OFF -D BUILD_TESTS=OFF ..
          ninja install

      - name: Run Go Build (Linux)
        run: |
          export PREFIX=$HOME/local_libs
          export OCV=$HOME/opencv_install
          OCV_PC=$(find $OCV -name pkgconfig -type d | tr '\n' ':')
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$OCV_PC$PKG_CONFIG_PATH"
          export LD_LIBRARY_PATH="$PREFIX/lib:$OCV/lib:$OCV/lib64"
          
          go build -v -o aloh-linux ./cmd/app

      - name: Collect Artifacts (Linux)
        run: |
          mkdir -p out/libs
          cp aloh-linux out/
          find $HOME/local_libs/lib -name "*.so*" -exec cp -P {} out/libs/ \;
          find $HOME/opencv_install -name "*.so*" -exec cp -P {} out/libs/ \;
          tar cfvz aloh-linux.tar.gz -C out .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Pkg-Config
        run: choco install pkgconfiglite

      - name: Build All Dependencies Manually (Windows Static)
        shell: cmd
        run: |
          set PREFIX=C:\local_libs
          mkdir %PREFIX%\lib\pkgconfig
          mkdir %PREFIX%\include

          git clone --depth 1 https://github.com/xiph/ogg.git
          cd ogg && mkdir build && cd build && cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF .. && ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus && mkdir build && cd build && cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF .. && ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/opusfile.git
          cd opusfile && mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF -DOP_DISABLE_HTTP=ON -DOPUS_INCLUDE_DIR=%PREFIX%/include/opus -DOGG_INCLUDE_DIR=%PREFIX%/include ..
          ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/speexdsp.git
          cd speexdsp && mkdir build && cd build && cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF .. && ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise
          cl /O2 /Iinclude /Isrc /c src/*.c
          lib /out:rnnoise.lib *.obj
          copy rnnoise.lib %PREFIX%\lib\
          copy include\rnnoise.h %PREFIX%\include\
          (
            echo Name: rnnoise
            echo Version: 0.1
            echo Description: rnnoise
            echo Libs: -LC:/local_libs/lib -lrnnoise
            echo Cflags: -IC:/local_libs/include
          ) > %PREFIX%\lib\pkgconfig\rnnoise.pc
          cd ..

      - name: Build OpenCV (Windows Static)
        shell: cmd
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir opencv\build && cd opencv\build
          cmake -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="C:/opencv_install" ^
            -DBUILD_opencv_world=ON ^
            -DOPENCV_GENERATE_PKGCONFIG=ON ^
            -DBUILD_SHARED_LIBS=OFF -DWITH_WEBP=ON -DBUILD_WEBP=ON ^
            -DWITH_MSMF=ON -DWITH_DSHOW=ON ^
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF ..
          ninja install

      - name: Run Go Build (Windows)
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          PREFIX="C:/local_libs"
          OCV="C:/opencv_install"
          
          OCV_PC=$(find $OCV -name pkgconfig -type d | tr '\n' ':')
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$OCV_PC"
          
          OCV_LIB_DIR=$(find $OCV -name "opencv_world4100.lib" | xargs dirname | head -n 1)
          
          export CGO_CFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_CXXFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV_LIB_DIR \
            -lopencv_world4100 -lopusfile -lopus -logg -lspeexdsp -lrnnoise \
            -lzlib -llibwebp -llibjpeg-turbo -llibpng \
            -lws2_32 -lwinmm -lole32 -lgdi32 -lavifil32 -lmsvfw32 -lcomdlg32 -ladvapi32 -lshell32 -luser32 -lkernel32 -loleaut32 -luuid"
          
          go build -v -tags netgo,osusergo -ldflags="-s -w -extldflags '-static' -X 'main.version=${{ github.event.inputs.version }}'" -o aloh.exe ./cmd/app

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe