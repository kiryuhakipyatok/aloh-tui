name: Build Aloh App (Manual Static Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Pkg-Config
        run: choco install pkgconfiglite

      - name: Build All Dependencies Manually
        shell: cmd
        run: |
          set PREFIX=C:\local_libs
          mkdir %PREFIX%\lib\pkgconfig
          mkdir %PREFIX%\include

          :: 1. Сборка OGG (Статически)
          git clone --depth 1 https://github.com/xiph/ogg.git
          cd ogg && mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF ..
          ninja install
          cd ..\..\

          :: 2. Сборка OPUS (Статически)
          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus && mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF ..
          ninja install
          cd ..\..\

          :: 3. Сборка SPEEXDSP (Статически)
          git clone --depth 1 https://github.com/xiph/speexdsp.git
          cd speexdsp && mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF ..
          ninja install
          cd ..\..\

          :: 4. Сборка RNNOISE (Вручную через cl.exe)
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise
          cl /O2 /Iinclude /Isrc /c src/*.c
          lib /out:rnnoise.lib *.obj
          copy rnnoise.lib %PREFIX%\lib\
          copy include\rnnoise.h %PREFIX%\include\
          cd ..

          :: 5. Создание .pc файлов вручную (чтобы Go их увидел)
          :: RNNOISE.PC
          echo prefix=C:/local_libs> %PREFIX%/lib/pkgconfig/rnnoise.pc
          echo libdir=${prefix}/lib>> %PREFIX%/lib/pkgconfig/rnnoise.pc
          echo includedir=${prefix}/include>> %PREFIX%/lib/pkgconfig/rnnoise.pc
          echo Name: rnnoise>> %PREFIX%/lib/pkgconfig/rnnoise.pc
          echo Description: RNNoise library>> %PREFIX%/lib/pkgconfig/rnnoise.pc
          echo Version: 0.1>> %PREFIX%/lib/pkgconfig/rnnoise.pc
          echo Libs: -L${libdir} -lrnnoise>> %PREFIX%/lib/pkgconfig/rnnoise.pc
          echo Cflags: -I${includedir}>> %PREFIX%/lib/pkgconfig/rnnoise.pc

          :: Для OGG, OPUS и SPEEXDSP файлы обычно создаются сами в %PREFIX%/lib/pkgconfig/
          :: Если их там нет, Go упадет. Проверим наличие:
          dir %PREFIX%\lib\pkgconfig\

      - name: Build OpenCV (Static World)
        shell: cmd
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir opencv\build && cd opencv\build
          cmake -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="C:/opencv_install" ^
            -DBUILD_opencv_world=ON ^
            -DOPENCV_GENERATE_PKGCONFIG=ON ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DBUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo ^
            -DWITH_WEBP=ON -DBUILD_WEBP=ON -DWITH_MSMF=ON -DWITH_DSHOW=ON ^
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF ..
          ninja install

      - name: Run Go Build (Windows Static)
        shell: bash
        env:
          CGO_ENABLED: 1
          # Важно: указываем все пути, где лежат .pc файлы
          PKG_CONFIG_PATH: "C:/local_libs/lib/pkgconfig:C:/opencv_install/lib/pkgconfig:C:/opencv_install/staticlib/pkgconfig"
        run: |
          PREFIX="C:/local_libs"
          OCV="C:/opencv_install"
          
          # Поиск папки с либами OpenCV (в static билдах путь может быть разным)
          OCV_LIB_DIR=$(find $OCV -name "opencv_world4100.lib" | xargs dirname | head -n 1)
          echo "OpenCV Libs found in: $OCV_LIB_DIR"
          
          # Флаги компиляции
          export CGO_CFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_CXXFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          
          # Полный список либ для статического билда (включая системные)
          # Для MSVC порядок и список важны
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV_LIB_DIR \
            -lopencv_world4100 -lopus -logg -lspeexdsp -lrnnoise \
            -lzlib -llibwebp -llibjpeg-turbo -llibpng \
            -lws2_32 -lwinmm -lole32 -lgdi32 -lavifil32 -lmsvfw32 -lcomdlg32 -ladvapi32 -lshell32 -luser32 -lkernel32 -loleaut32 -luuid"
          
          # Сборка
          go build -v -tags netgo,osusergo \
            -ldflags="-s -w -extldflags '-static' -X 'main.version=${{ github.event.inputs.version }}'" \
            -o aloh.exe ./cmd/app

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe