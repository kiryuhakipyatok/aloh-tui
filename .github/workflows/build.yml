name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "1.0.0"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ make pkg-config cmake git autoconf automake libtool \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxext-dev libxfixes-dev libxtst-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev \
            libasound2-dev libpulse-dev \
            libogg-dev libopus-dev libopusfile-dev libspeexdsp-dev libvpx-dev

      - name: Build RNNoise (Shared)
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=$HOME/local_libs --enable-shared --disable-static
          make -j$(nproc) install

      - name: Build Linux application
        env:
          CGO_ENABLED: "1"
        run: |
          PREFIX="$HOME/local_libs"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$(pkg-config --variable=pc_path pkg-config)"

          export CGO_CFLAGS="-I$PREFIX/include"
          export CGO_LDFLAGS="-L$PREFIX/lib"
          
          go build \
            -tags nomicrophone \
            -v -trimpath \
            -ldflags="-s -w -X main.version=${{ inputs.version }} -linkmode external -extldflags '-Wl,-rpath,\$ORIGIN'" \
            -o aloh-linux \
            ./cmd/app

      - name: Package Linux
        run: |
          mkdir -p dist-linux
          cp aloh-linux dist-linux/
          
          lddtree -l aloh-linux | grep '^/' | while read -r lib; do
            libname=$(basename "$lib")
            case "$libname" in
              libopus*|libogg*|librnnoise*|libspeexdsp*|libvpx*)
                cp -L -v "$lib" dist-linux/
                ;;
            esac
          done
          cp -d $HOME/local_libs/lib/librnnoise.so* dist-linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: dist-linux/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git make autoconf automake libtool pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-libsharpyuv

      - name: Build RNNoise (Static)
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=/mingw64 --enable-static --disable-shared
          make -j$(nproc) install

      - name: Build Windows application
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |

          go build \
            -v -trimpath \
            -tags nomicrophone \
            -ldflags="-s -w -X main.version=${{ inputs.version }} -extldflags '-static -lsharpyuv -logg'" \
            -o aloh.exe \
            ./cmd/app

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe