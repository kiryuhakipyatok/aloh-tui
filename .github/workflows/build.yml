name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'
      env:
        description: 'Environment'
        required: true
        default: 'prod'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libasound2-dev libpulse-dev libwebp-dev cmake libogg-dev libopus-dev libopusfile-dev libspeexdsp-dev

      - name: Cache OpenCV Linux
        id: cache-opencv-linux
        uses: actions/cache@v4
        with:
          path: /home/runner/opencv_install
          key: opencv-linux-4.10.0-v8

      - name: Build OpenCV (Linux)
        if: steps.cache-opencv-linux.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir -p opencv/build && cd opencv/build
          cmake -D CMAKE_BUILD_TYPE=RELEASE \
                -D CMAKE_INSTALL_PREFIX=/home/runner/opencv_install \
                -D BUILD_opencv_world=ON \
                -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
                -D WITH_V4L=ON -D WITH_WEBP=ON -D BUILD_EXAMPLES=OFF -D BUILD_TESTS=OFF ..
          make -j$(nproc) && make install

      - name: Set Environment & Build (Linux)
        run: |
          PC_DIR=$(find /home/runner/opencv_install -name opencv4.pc -exec dirname {} \; | head -n 1)
          echo "PKG_CONFIG_PATH=$PC_DIR:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          
          echo "CGO_CPPFLAGS=-I/home/runner/opencv_install/include/opencv4" >> $GITHUB_ENV
          echo "CGO_CXXFLAGS=-I/home/runner/opencv_install/include/opencv4" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L/home/runner/opencv_install/lib -L/home/runner/opencv_install/lib64 -lopencv_world -lopusfile -lopus -logg -lspeexdsp -lm" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/home/runner/opencv_install/lib:/home/runner/opencv_install/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Run Go Build (Linux)
        run: go build -v -o aloh-linux ./cmd/app

      - name: Collect Libraries (Linux)
        run: |
          mkdir -p out/libs
          cp aloh-linux out/
          find /home/runner/opencv_install -name "*.so*" -exec cp -P {} out/libs/ \;
          cp /usr/lib/x86_64-linux-gnu/libopus.so* out/libs/ 2>/dev/null || true
          tar cfvz aloh-linux.tar.gz -C out .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache OpenCV Windows
        id: cache-opencv-windows
        uses: actions/cache@v4
        with:
          path: C:/opencv_install
          key: opencv-windows-4.10.0-v8

      - name: Build OpenCV (Windows)
        if: steps.cache-opencv-windows.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir opencv\build
          cd opencv\build
          cmake -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="C:/opencv_install" ^
            -DBUILD_opencv_world=ON ^
            -DBUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo ^
            -DBUILD_SHARED_LIBS=OFF -DWITH_WEBP=ON -DBUILD_WEBP=ON -DWITH_MSMF=ON -DWITH_DSHOW=ON ^
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_opencv_apps=OFF ..
          cmake --build . --target install

      - name: Build Audio Libs
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          vcpkg install opus opusfile libogg speexdsp --triplet x64-windows-static

      - name: Build RNNoise
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && mkdir build_win && cl /O2 /Iinclude /Isrc /c src/*.c && lib /out:rnnoise.lib *.obj
          mkdir C:\rnnoise_install\lib && mkdir C:\rnnoise_install\include
          copy rnnoise.lib C:\rnnoise_install\lib\ && copy include\rnnoise.h C:\rnnoise_install\include\

      - name: Set Windows Environment
        shell: bash
        run: |
          VCPKG_INC="C:/vcpkg/installed/x64-windows-static/include"
          VCPKG_LIB="C:/vcpkg/installed/x64-windows-static/lib"
          OCV_INC="C:/opencv_install/include/opencv4"
          OCV_LIB="C:/opencv_install/lib"
          [ -d "C:/opencv_install/x64/vc17/staticlib" ] && OCV_LIB="C:/opencv_install/x64/vc17/staticlib"
          
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "PKG_CONFIG=" >> $GITHUB_ENV
          echo "CGO_CPPFLAGS=-I$OCV_INC -I$VCPKG_INC -I/c/rnnoise_install/include" >> $GITHUB_ENV
          echo "CGO_CXXFLAGS=-I$OCV_INC -I$VCPKG_INC -I/c/rnnoise_install/include" >> $GITHUB_ENV
 
          LDFLAGS="-L$OCV_LIB -L$VCPKG_LIB -L/c/rnnoise_install/lib -Wl,--start-group -lopencv_world4100 -lopusfile -lopus -logg -lspeexdsp -lrnnoise -lzlib -llibwebp -llibjpeg-turbo -llibpng -lpng -lz -Wl,--end-group -lws2_32 -lole32 -lgdi32 -lavifil32 -lmsvfw32 -lcomdlg32 -ladvapi32 -lshell32 -luser32 -lkernel32 -loleaut32 -luuid"
          echo "CGO_LDFLAGS=$LDFLAGS" >> $GITHUB_ENV

      - name: Run Go Build (Windows)
        run: go build -v -tags netgo,osusergo -ldflags="-s -w -extldflags '-static' -X 'main.version=${{ github.event.inputs.version }}'" -o aloh.exe ./cmd/app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe