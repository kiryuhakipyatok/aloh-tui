name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "1.0.0"

jobs:

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libtool \
            autoconf \
            automake \
            libx11-dev \
            libxcb1-dev \
            libasound2-dev \
            libpulse-dev \
            libwebp-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            libspeexdsp-dev

      - name: Build RNNoise
        run: |
          set -e

          mkdir -p "$HOME/local_libs"

          git clone --depth 1 \
            https://github.com/xiph/rnnoise.git

          cd rnnoise

          ./autogen.sh

          ./configure \
            --prefix="$HOME/local_libs" \
            --enable-shared \
            --disable-static

          make -j"$(nproc)"
          make install

      - name: Build OpenCV
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch 4.10.0 \
            https://github.com/opencv/opencv.git

          cmake \
            -S opencv \
            -B opencv/build \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_INSTALL_PREFIX="$HOME/opencv_install" \
            -D BUILD_SHARED_LIBS=ON \
            -D OPENCV_GENERATE_PKGCONFIG=ON \
            -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
            -D BUILD_EXAMPLES=OFF \
            -D BUILD_TESTS=OFF \
            -D BUILD_PERF_TESTS=OFF

          cmake --build opencv/build --parallel
          cmake --install opencv/build

      - name: Build Go application
        run: |
          set -e

          export PREFIX="$HOME/local_libs"
          export OCV="$HOME/opencv_install"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$OCV/lib/pkgconfig:$PKG_CONFIG_PATH"

          export CGO_CPPFLAGS="
            -I$PREFIX/include
            -I$OCV/include/opencv4
          "

          export CGO_LDFLAGS="
            -L$PREFIX/lib
            -L$OCV/lib
            -lopencv_core
            -lopencv_videoio
            -lopencv_imgproc
            -lopencv_imgcodecs
            -lopencv_highgui
            -lopusfile
            -lopus
            -logg
            -lspeexdsp
            -lrnnoise
            -Wl,-rpath,'\$ORIGIN'
          "

          go build \
            -v \
            -o aloh-linux \
            ./cmd/app

      - name: Package Linux
        run: |
          set -e

          mkdir -p dist-linux

          cp aloh-linux dist-linux/

          find "$HOME/local_libs/lib" \
            -maxdepth 1 \
            -name "*.so*" \
            -exec cp -d {} dist-linux/ \;

          find "$HOME/opencv_install/lib" \
            -maxdepth 1 \
            -name "*.so*" \
            -exec cp -d {} dist-linux/ \;

          tar cfvz aloh-linux.tar.gz \
            -C dist-linux .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz


  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git
            make
            autoconf
            automake
            libtool
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ogg
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libtiff

      - name: Check MSYS2 dependencies
        shell: msys2 {0}
        run: |
          set -eux

          which pkg-config
          pkg-config --version

          pkg-config --modversion ogg
          pkg-config --cflags --libs ogg

          pkg-config --modversion opus
          pkg-config --cflags --libs opus

          pkg-config --modversion opusfile
          pkg-config --cflags --libs opusfile

          pkg-config --modversion speexdsp
          pkg-config --cflags --libs speexdsp

      - name: Build RNNoise
        shell: msys2 {0}
        run: |
          set -eux

          mkdir -p /opt/local

          git clone --depth 1 https://github.com/xiph/rnnoise.git

          cd rnnoise

          ./autogen.sh

          ./configure \
            --prefix=/opt/local \
            --enable-shared \
            --disable-static

          make -j$(nproc)
          make install

          cd ..

      - name: Build OpenCV
        shell: msys2 {0}
        run: |
          set -eux

          git clone --depth 1 \
            --branch 4.10.0 \
            https://github.com/opencv/opencv.git

          cmake -S opencv -B opencv/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/opencv \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_opencv_world=ON \
            -DOPENCV_GENERATE_PKGCONFIG=OFF \
            -DBUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF

          cmake --build opencv/build --target install -j$(nproc)

      - name: Verify OpenCV
        shell: msys2 {0}
        run: |
          set -eux

          test -f /opt/opencv/include/opencv4/opencv2/opencv.hpp

          echo "OpenCV header OK"

          find /opt/opencv -iname "*opencv_world*"

          find /opt/local -iname "*rnnoise*"

      - name: Build Go application
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
        run: |
          set -eux

          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/opt/local/lib/pkgconfig:/opt/opencv/lib/pkgconfig"

          export CGO_CFLAGS="\
            -I/mingw64/include \
            -I/opt/local/include \
            -I/opt/opencv/include/opencv4"

          export CGO_LDFLAGS="\
            -L/mingw64/lib \
            -L/opt/local/lib \
            -L/opt/opencv/lib \
            -lopencv_world4100 \
            -lopusfile \
            -lopus \
            -logg \
            -lspeexdsp \
            -lrnnoise"

          echo "=== pkg-config ==="

          pkg-config --cflags --libs opus
          pkg-config --cflags --libs opusfile
          pkg-config --cflags --libs speexdsp

          test -f /opt/opencv/include/opencv4/opencv2/opencv.hpp

          go version

          echo "=== Build ==="

          go build \
            -v \
            -o aloh.exe \
            ./cmd/app

      - name: Verify executable
        shell: msys2 {0}
        run: |
          set -eux

          test -f aloh.exe

          file aloh.exe

      - name: Package Windows
        shell: msys2 {0}
        run: |
          set -eux

          mkdir -p dist-win

          cp aloh.exe dist-win/

          find /opt/opencv/bin \
            -maxdepth 1 \
            -type f \
            -iname "*.dll" \
            -exec cp {} dist-win/ \;

          find /opt/local/bin \
            -maxdepth 1 \
            -type f \
            -iname "*.dll" \
            -exec cp {} dist-win/ \;

          cp /mingw64/bin/libwinpthread-1.dll dist-win/
          cp /mingw64/bin/libstdc++-6.dll dist-win/
          cp /mingw64/bin/libgcc_s_seh-1.dll dist-win/

          for dll in \
            libogg-*.dll \
            libopus-*.dll \
            libopusfile-*.dll \
            libspeexdsp-*.dll
          do
            if compgen -G "/mingw64/bin/$dll" > /dev/null; then
              cp /mingw64/bin/$dll dist-win/
            fi
          done

          ls -lah dist-win/

          tar cfvz aloh-windows.tar.gz -C dist-win .

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh-windows.tar.gz