name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'
      env:
        description: 'Environment'
        required: true
        default: 'prod'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxext-dev libxfixes-dev libasound2-dev libpulse-dev libwebp-dev

      - name: Build Dependencies (Linux)
        run: |
          export PREFIX=$HOME/local_libs
          mkdir -p $PREFIX

          wget https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
          tar -xzf libogg-1.3.5.tar.gz && cd libogg-1.3.5
          ./configure --prefix=$PREFIX --enable-shared --disable-static && make -j$(nproc) && make install
          cd ..

          wget https://downloads.xiph.org/releases/opus/opus-1.4.tar.gz
          tar -xzf opus-1.4.tar.gz && cd opus-1.4
          ./configure --prefix=$PREFIX --enable-shared --disable-static && make -j$(nproc) && make install
          cd ..
          wget https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz
          tar -xzf opusfile-0.12.tar.gz && cd opusfile-0.12
          export pkg_config_path=$PREFIX/lib/pkgconfig
          PKG_CONFIG_PATH=$pkg_config_path ./configure --prefix=$PREFIX --disable-http && make -j$(nproc) && make install
          cd ..

          wget https://downloads.xiph.org/releases/speex/speexdsp-1.2.1.tar.gz
          tar -xzf speexdsp-1.2.1.tar.gz && cd speexdsp-1.2.1
          ./configure --prefix=$PREFIX --enable-shared --disable-static && make -j$(nproc) && make install
          cd ..

          # 5. RNNoise
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && ./autogen.sh
          ./configure --prefix=$PREFIX --enable-shared --disable-static && make -j$(nproc) && make install
          cd ..

      - name: Build OpenCV (Linux)
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir -p opencv/build && cd opencv/build
          cmake -D CMAKE_BUILD_TYPE=RELEASE -D CMAKE_INSTALL_PREFIX=$HOME/opencv_install \
                -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
                -D WITH_V4L=ON -D WITH_WEBP=ON -D BUILD_EXAMPLES=OFF -D BUILD_TESTS=OFF ..
          make -j$(nproc) && make install

      - name: Run Go Build (Linux)
        run: |
          export PREFIX=$HOME/local_libs
          export OCV=$HOME/opencv_install
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$OCV/lib/pkgconfig:$OCV/lib64/pkgconfig"
          export CGO_CPPFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_CXXFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV/lib -L$OCV/lib64 -lopencv_core -lopencv_videoio -lopencv_imgproc -lopencv_imgcodecs -lopencv_highgui -lopusfile -lopus -logg -lspeexdsp -lrnnoise -lm"
          go build -v -o aloh-linux ./cmd/app

      - name: Collect Artifacts (Linux)
        run: |
          mkdir -p out/libs
          cp aloh-linux out/
          find $HOME/local_libs/lib -name "*.so*" -exec cp -P {} out/libs/ \;
          find $HOME/opencv_install -name "*.so*" -exec cp -P {} out/libs/ \;
          tar cfvz aloh-linux.tar.gz -C out .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Dependencies (Windows Static)
        shell: cmd
        run: |
          mkdir C:\build_deps
          set PREFIX=C:\local_libs
          mkdir %PREFIX%\lib
          mkdir %PREFIX%\include
          git clone --depth 1 https://github.com/xiph/ogg.git
          cd ogg && mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF ..
          ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus && mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF ..
          ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/speexdsp.git
          cd speexdsp && mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF ..
          ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && cl /O2 /Iinclude /Isrc /c src/*.c && lib /out:rnnoise.lib *.obj
          copy rnnoise.lib %PREFIX%\lib\ && copy include\rnnoise.h %PREFIX%\include\
          cd ..

          :: 5. Opusfile (Manual Build for Windows Static)
          git clone --depth 1 https://github.com/xiph/opusfile.git
          cd opusfile
          cl /O2 /Iinclude /Isrc /I%PREFIX%\include /DOP_DISABLE_HTTP /c src/*.c
          lib /out:opusfile.lib *.obj
          copy opusfile.lib %PREFIX%\lib\ && copy include\opusfile.h %PREFIX%\include\
          cd ..

      - name: Build OpenCV (Windows Static)
        shell: cmd
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir opencv\build && cd opencv\build
          cmake -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="C:/opencv_install" ^
            -DBUILD_opencv_world=ON ^
            -DBUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo ^
            -DBUILD_SHARED_LIBS=OFF -DWITH_WEBP=ON -DBUILD_WEBP=ON -DWITH_MSMF=ON -DWITH_DSHOW=ON ^
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF ..
          ninja install

      - name: Run Go Build (Windows)
        shell: bash
        run: |
          export PREFIX="C:/local_libs"
          export OCV="C:/opencv_install"
          OCV_LIB="$OCV/lib"
          [ -d "$OCV/x64/vc17/staticlib" ] && OCV_LIB="$OCV/x64/vc17/staticlib"

          export CGO_ENABLED=1
          export CGO_CPPFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_CXXFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV_LIB \
            -Wl,--start-group -lopencv_world4100 -lopusfile -lopus -logg -lspeexdsp -lrnnoise \
            -lzlib -llibwebp -llibjpeg-turbo -llibpng -lpng -lz -Wl,--end-group \
            -lws2_32 -lole32 -lgdi32 -lavifil32 -lmsvfw32 -lcomdlg32 -ladvapi32 -lshell32 -luser32 -lkernel32 -loleaut32 -luuid"
          
          go build -v -tags netgo,osusergo -ldflags="-s -w -extldflags '-static' -X 'main.version=${{ github.event.inputs.version }}'" -o aloh.exe ./cmd/app

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe