name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "1.0.0"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libx11-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libv4l-dev libasound2-dev \
            libwebp-dev pkg-config

      - name: Build
        run: |
          export CGO_ENABLED=1
          go build -v -o aloh-linux ./cmd/app

      - name: Package Linux
        run: |
          mkdir -p dist-linux
          cp aloh-linux dist-linux/
          tar -czvf aloh-linux.tar.gz -C dist-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libwebp
            pkgconf

      - name: Build Windows
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          
          go version
          gcc --version
          pkg-config --libs libwebp

          # -ldflags="-H windowsgui" убирает консольное окно при запуске
          go build -v -ldflags="-H windowsgui" -o aloh.exe ./cmd/app

      - name: Package Windows
        shell: bash
        run: |
          mkdir -p dist-win
          cp aloh.exe dist-win/
          
          MSYS_BIN="/c/msys64/mingw64/bin"
          cp $MSYS_BIN/libwebp-*.dll dist-win/ || true
          cp $MSYS_BIN/libwinpthread-1.dll dist-win/ || true
          cp $MSYS_BIN/libgcc_s_seh-1.dll dist-win/ || true
          cp $MSYS_BIN/libstdc++-6.dll dist-win/ || true

          tar -czvf aloh-windows.tar.gz -C dist-win .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh-windows.tar.gz