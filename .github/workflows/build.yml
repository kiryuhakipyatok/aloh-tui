name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libtool autoconf \
            libx11-dev libxcb1-dev libasound2-dev libpulse-dev libwebp-dev \
            libogg-dev libopus-dev libopusfile-dev libspeexdsp-dev

      - name: Build RNNoise (Linux)
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && ./autogen.sh
          ./configure --prefix=$HOME/local_libs --enable-shared --disable-static
          make -j$(nproc) && make install

      - name: Build OpenCV (Linux)
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir -p opencv/build && cd opencv/build
          cmake -D CMAKE_BUILD_TYPE=RELEASE \
                -D CMAKE_INSTALL_PREFIX=$HOME/opencv_install \
                -D OPENCV_GENERATE_PKGCONFIG=ON \
                -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
                -D WITH_V4L=ON -D WITH_WEBP=ON -D BUILD_EXAMPLES=OFF -D BUILD_TESTS=OFF ..
          make -j$(nproc) && make install

      - name: Run Go Build (Linux)
        run: |
          export PREFIX=$HOME/local_libs
          export OCV=$HOME/opencv_install
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$(find $OCV -name pkgconfig -type d | tr '\n' ':')$PKG_CONFIG_PATH"
          
          export CGO_CPPFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV/lib -L$OCV/lib64 -lopencv_core -lopencv_videoio -lopencv_imgproc -lopencv_imgcodecs -lopencv_highgui -lopusfile -lopus -logg -lspeexdsp -lrnnoise -lm"
          
          go build -v -o aloh-linux ./cmd/app

      - name: Collect Artifacts (Linux)
        run: |
          mkdir -p out/libs
          cp aloh-linux out/
          find $HOME/local_libs/lib -name "*.so*" -exec cp -P {} out/libs/ \;
          find $HOME/opencv_install -name "*.so*" -exec cp -P {} out/libs/ \;
          tar cfvz aloh-linux.tar.gz -C out .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install pkg-config and Dependencies
        run: |
          choco install pkgconfiglite
          vcpkg install opus opusfile libogg speexdsp --triplet x64-windows-static

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build RNNoise (Windows)
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise
          cl /O2 /Iinclude /Isrc /D_USE_MATH_DEFINES /D_CRT_SECURE_NO_WARNINGS /c ^
             src/denoise.c src/rnn.c src/rnn_data.c src/pitch.c src/kiss_fft.c src/celt_lpc.c src/nnet.c
          if %errorlevel% neq 0 exit /b %errorlevel%
          lib /out:rnnoise.lib denoise.obj rnn.obj rnn_data.obj pitch.obj kiss_fft.obj celt_lpc.obj nnet.obj
          mkdir C:\local_libs\include && mkdir C:\local_libs\lib
          copy rnnoise.lib C:\local_libs\lib\ && copy include\rnnoise.h C:\local_libs\include\

      - name: Build OpenCV (Windows Static)
        shell: cmd
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir opencv\build && cd opencv\build
          cmake -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="C:/opencv_install" ^
            -DBUILD_opencv_world=ON ^
            -DBUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DWITH_WEBP=ON -DBUILD_WEBP=ON ^
            -DWITH_MSMF=ON -DWITH_DSHOW=ON ^
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF ^
            -DOPENCV_GENERATE_PKGCONFIG=ON ..
          ninja install

      - name: Run Go Build (Windows)
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          PREFIX="C:/local_libs"
          OCV="C:/opencv_install"
          VCPKG="C:/vcpkg/installed/x64-windows-static"
          
          export PKG_CONFIG_PATH="$VCPKG/lib/pkgconfig:$OCV/lib/pkgconfig:$PKG_CONFIG_PATH"

          OCV_LIB_DIR=$(find $OCV -name "opencv_world4100.lib" | xargs dirname | head -n 1)
          OCV_3RDPARTY=$(find $OCV -name "zlib.lib" | xargs dirname | head -n 1)
          
          export CGO_CFLAGS="-I$PREFIX/include -I$OCV/include/opencv4 -I$OCV/include -I$VCPKG/include"
          export CGO_CXXFLAGS="-I$PREFIX/include -I$OCV/include/opencv4 -I$OCV/include -I$VCPKG/include"
       
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV_LIB_DIR -L$OCV_3RDPARTY -L$VCPKG/lib \
            -lopencv_world4100 -lrnnoise -lopusfile -lopus -logg -lspeexdsp \
            -lade -littnotify -lzlib -llibwebp -llibjpeg-turbo -llibpng -llibopenjp2 \
            -luser32 -lgdi32 -lws2_32 -lcomdlg32 -ladvapi32 -lshell32 -lole32 -loleaut32 -luuid -lavifil32 -lmsvfw32"

          go build -v -tags netgo,osusergo -ldflags="-s -w -extldflags '-static' -X 'main.version=${{ github.event.inputs.version }}'" -o aloh.exe ./cmd/app

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe