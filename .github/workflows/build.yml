name: Build Aloh App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # Исправлено
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libtool autoconf \
            libx11-dev libxcb1-dev libasound2-dev libpulse-dev libwebp-dev \
            libogg-dev libopus-dev libopusfile-dev libspeexdsp-dev

      - name: Build RNNoise (Linux)
        run: |
          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && ./autogen.sh
          ./configure --prefix=$HOME/local_libs --enable-shared --disable-static
          make -j$(nproc) && make install

      - name: Build OpenCV (Linux)
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir -p opencv/build && cd opencv/build
          # Добавлен OPENCV_GENERATE_PKGCONFIG и расширен список модулей для gocv
          cmake -D CMAKE_BUILD_TYPE=RELEASE \
                -D CMAKE_INSTALL_PREFIX=$HOME/opencv_install \
                -D OPENCV_GENERATE_PKGCONFIG=ON \
                -D BUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo \
                -D WITH_V4L=ON -D WITH_WEBP=ON -D BUILD_EXAMPLES=OFF -D BUILD_TESTS=OFF ..
          make -j$(nproc) && make install

      - name: Run Go Build (Linux)
        run: |
          export PREFIX=$HOME/local_libs
          export OCV=$HOME/opencv_install
          # Правильный поиск pkgconfig (проверяем и lib, и lib64)
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$(find $OCV -name pkgconfig -type d | tr '\n' ':')$PKG_CONFIG_PATH"
          
          export CGO_CPPFLAGS="-I$PREFIX/include -I$OCV/include/opencv4"
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV/lib -L$OCV/lib64 -lopencv_core -lopencv_videoio -lopencv_imgproc -lopencv_imgcodecs -lopencv_highgui -lopusfile -lopus -logg -lspeexdsp -lrnnoise -lm"
          
          go build -v -o aloh-linux ./cmd/app

      - name: Collect Artifacts (Linux)
        run: |
          mkdir -p out/libs
          cp aloh-linux out/
          find $HOME/local_libs/lib -name "*.so*" -exec cp -P {} out/libs/ \;
          find $HOME/opencv_install -name "*.so*" -exec cp -P {} out/libs/ \;
          tar cfvz aloh-linux.tar.gz -C out .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: aloh-linux
          path: aloh-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Используем стабильную 1.23
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Dependencies (Windows Static)
        shell: cmd
        run: |
          set PREFIX=C:\local_libs
          mkdir %PREFIX%\lib
          mkdir %PREFIX%\include
          
          git clone --depth 1 https://github.com/xiph/ogg.git
          cd ogg && mkdir build && cd build && cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF .. && ninja install
          cd ..\..\
          
          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus && mkdir build && cd build && cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%PREFIX% -DBUILD_SHARED_LIBS=OFF .. && ninja install
          cd ..\..\

          git clone --depth 1 https://github.com/xiph/rnnoise.git
          cd rnnoise && cl /O2 /Iinclude /Isrc /c src/*.c && lib /out:rnnoise.lib *.obj
          copy rnnoise.lib %PREFIX%\lib\ && copy include\rnnoise.h %PREFIX%\include\
          cd ..

      - name: Build OpenCV (Windows Static)
        shell: cmd
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
          mkdir opencv\build && cd opencv\build
          cmake -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="C:/opencv_install" ^
            -DBUILD_opencv_world=ON ^
            -DBUILD_LIST=core,videoio,imgproc,imgcodecs,highgui,video,calib3d,features2d,objdetect,dnn,photo,stitching,ml ^
            -DBUILD_SHARED_LIBS=OFF -DWITH_WEBP=ON -DBUILD_WEBP=ON -DWITH_MSMF=ON -DWITH_DSHOW=ON ^
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DOPENCV_GENERATE_PKGCONFIG=ON ..
          ninja install

      - name: Verify OpenCV Install
        shell: bash
        run: |
          echo "Checking OpenCV headers..."
          ls -R "C:/opencv_install/include/opencv4/opencv2" | head -n 20
          echo "Checking OpenCV libs..."
          ls -R "C:/opencv_install/" | grep ".lib"

      - name: Run Go Build (Windows)
        shell: bash
        env:
          CGO_ENABLED: 1
          # Важно: добавляем и корневой include, и include/opencv4
          CGO_CFLAGS: "-IC:/local_libs/include -IC:/opencv_install/include/opencv4 -IC:/opencv_install/include"
          CGO_CXXFLAGS: "-IC:/local_libs/include -IC:/opencv_install/include/opencv4 -IC:/opencv_install/include"
        run: |
          PREFIX="C:/local_libs"
          OCV="C:/opencv_install"
          
          # Находим путь к либам (в OpenCV 4 статические либы могут быть в разных подпапках)
          OCV_LIB_DIR=$(find $OCV -name "opencv_world4100.lib" | xargs dirname | head -n 1)
          echo "Found OpenCV libs in: $OCV_LIB_DIR"
          
          # Указываем LDFLAGS прямо в команде сборки для надежности
          export CGO_LDFLAGS="-L$PREFIX/lib -L$OCV_LIB_DIR \
            -Wl,--start-group -lopencv_world4100 -lopus -logg -lrnnoise \
            -lzlib -llibwebp -llibjpeg-turbo -llibpng -lws2_32 -lole32 -lgdi32 -lavifil32 -lmsvfw32 -lcomdlg32 -ladvapi32 -lshell32 -luser32 -lkernel32 -loleaut32 -luuid -Wl,--end-group"
          
          go build -v -tags netgo,osusergo -ldflags="-s -w -extldflags '-static' -X 'main.version=${{ github.event.inputs.version }}'" -o aloh.exe ./cmd/app

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: aloh-windows
          path: aloh.exe